name: Build without itch.io

on:
  workflow_dispatch:
    inputs:
      github_release_tag:
        description: Optional GitHub Release tag (e.g. v0.4.1). Leave empty for workflow artifacts only.
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos:
    uses: ./.github/workflows/build-target.yml
    with:
      slug: macos-aarch64
      os: macos-latest
      rust_target: aarch64-apple-darwin
      tauri_args: --target aarch64-apple-darwin --bundles dmg
      platform: macos

  windows:
    uses: ./.github/workflows/build-target.yml
    with:
      slug: windows-x86_64
      os: windows-latest
      tauri_args: --bundles nsis
      platform: windows

  linux:
    uses: ./.github/workflows/build-target.yml
    with:
      slug: linux-x86_64
      os: ubuntu-22.04
      tauri_args: --bundles deb
      platform: linux
      linux_arch: x86_64

  linux-aarch64:
    uses: ./.github/workflows/build-target.yml
    with:
      slug: linux-aarch64
      os: ubuntu-22.04-arm
      tauri_args: --bundles deb
      platform: linux
      linux_arch: aarch64

  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux, linux-aarch64]
    if: ${{ inputs.github_release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.github_release_tag }}
          files: release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
