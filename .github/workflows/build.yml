name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            slug: macos-aarch64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg
          - name: Windows
            slug: windows-x86_64
            os: windows-latest
            rust_target: ""
            tauri_args: --bundles nsis
          - name: Linux
            slug: linux-x86_64
            os: ubuntu-22.04
            rust_target: ""
            tauri_args: --bundles deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Package Linux zip
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          STAGING="sortdraft_${VERSION}_linux_x86_64"
          mkdir -p "$STAGING"
          dpkg-deb -x "$DEB" "$STAGING"
          BIN=$(find "$STAGING/usr/bin" -maxdepth 1 -type f | head -1)
          BIN_NAME=$(basename "$BIN")
          {
            echo "Sortdraft ${VERSION} — portable Linux build"
            echo
            echo "Requires WebKitGTK 4.1 and GTK 3 (same libraries as the .deb package)."
            echo
            echo "Run the app from this folder:"
            echo "  ./usr/bin/${BIN_NAME}"
            echo
            echo "For system integration, prefer installing the included .deb package."
          } > "$STAGING/README.txt"
          zip -r "${STAGING}.zip" "$STAGING"
          mkdir -p release-artifacts
          cp "$DEB" release-artifacts/
          cp "${STAGING}.zip" release-artifacts/

      - name: Collect macOS artifacts
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/

      - name: Collect Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sortdraft-${{ matrix.slug }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
