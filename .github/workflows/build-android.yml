name: Build Android

on:
  workflow_call:
    secrets:
      ANDROID_KEY_BASE64:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

env:
  # NDK r27 LTS — Tauri v2's supported line. Bump deliberately.
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  build:
    name: Build (android-aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          rust_target: aarch64-linux-android

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            librsvg2-dev

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          ndk="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npm run android:init

      - name: Build Android APK
        run: npm run tauri android build -- --ci --apk --target aarch64

      - name: Sign APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED=$(find src-tauri/gen/android -name '*release-unsigned.apk' -print -quit)
          if [ -z "$UNSIGNED" ] || [ ! -f "$UNSIGNED" ]; then
            echo "::error::No unsigned release APK found"
            find src-tauri/gen/android -name '*.apk' || true
            exit 1
          fi

          STORE_PASS_FILE="$RUNNER_TEMP/ks.pass"
          KEY_PASS_FILE="$RUNNER_TEMP/key.pass"

          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            if [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
              echo "::error::ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS must be set when ANDROID_KEY_BASE64 is provided."
              exit 1
            fi
            echo "Signing with the release keystore from secrets."
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEYSTORE="$RUNNER_TEMP/release.jks"
            printf '%s' "$ANDROID_KEY_PASSWORD" > "$STORE_PASS_FILE"
            printf '%s' "$ANDROID_KEY_PASSWORD" > "$KEY_PASS_FILE"
            ALIAS="$ANDROID_KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEY_BASE64 secret — signing with a throwaway debug keystore. Installable for testing; set a release keystore for stable updates."
            KEYSTORE="$RUNNER_TEMP/debug.jks"
            "$JAVA_HOME/bin/keytool" -genkeypair -keystore "$KEYSTORE" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            printf '%s' android > "$STORE_PASS_FILE"
            printf '%s' android > "$KEY_PASS_FILE"
            ALIAS=androiddebugkey
          fi

          ALIGNED="$RUNNER_TEMP/sortdraft-aligned.apk"
          mkdir -p release-artifacts
          SIGNED="release-artifacts/sortdraft_${VERSION}_android_aarch64.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "file:$STORE_PASS_FILE" \
            --key-pass "file:$KEY_PASS_FILE" \
            --ks-key-alias "$ALIAS" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify "$SIGNED"
          rm -f "$STORE_PASS_FILE" "$KEY_PASS_FILE" "$RUNNER_TEMP/release.jks"
          echo "Signed $SIGNED ($(du -h "$SIGNED" | cut -f1))"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sortdraft-android-aarch64
          path: release-artifacts/*
          if-no-files-found: error
