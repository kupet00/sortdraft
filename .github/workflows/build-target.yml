name: Build target

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string
      os:
        required: true
        type: string
      rust_target:
        required: false
        type: string
        default: ""
      tauri_args:
        required: true
        type: string
      platform:
        required: true
        type: string
        description: macos, windows, or linux

jobs:
  build:
    name: Build (${{ inputs.slug }})
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          rust_target: ${{ inputs.rust_target }}

      - name: Install Linux dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      - name: Build Tauri app
        run: npm run tauri build -- ${{ inputs.tauri_args }}

      - name: Package Linux zip
        if: inputs.platform == 'linux'
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          STAGING="sortdraft_${VERSION}_linux_x86_64"
          mkdir -p "$STAGING"
          dpkg-deb -x "$DEB" "$STAGING"
          BIN=$(find "$STAGING/usr/bin" -maxdepth 1 -type f | head -1)
          BIN_NAME=$(basename "$BIN")
          {
            echo "Sortdraft ${VERSION} — portable Linux build"
            echo
            echo "Requires WebKitGTK 4.1 and GTK 3 (same libraries as the .deb package)."
            echo
            echo "Run the app from this folder:"
            echo "  ./usr/bin/${BIN_NAME}"
            echo
            echo "For system integration, prefer installing the included .deb package."
          } > "$STAGING/README.txt"
          zip -r "${STAGING}.zip" "$STAGING"
          mkdir -p release-artifacts
          cp "$DEB" release-artifacts/
          cp "${STAGING}.zip" release-artifacts/

      - name: Collect macOS artifacts
        if: inputs.platform == 'macos'
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/

      - name: Collect Windows artifacts
        if: inputs.platform == 'windows'
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe release-artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sortdraft-${{ inputs.slug }}
          path: release-artifacts/*
          if-no-files-found: error
