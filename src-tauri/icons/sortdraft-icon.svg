<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sortdraft">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2c2416" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="#8b4513"/>

  <!-- scattered card: back left -->
  <g filter="url(#shadow)" transform="translate(118 520) rotate(-18 150 190)">
    <rect width="300" height="380" rx="28" fill="#e8dfd0" stroke="#d4c9b8" stroke-width="6"/>
    <line x1="48" y1="92" x2="252" y2="92" stroke="#c4a574" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <line x1="48" y1="142" x2="220" y2="142" stroke="#c4a574" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- scattered card: upper right -->
  <g filter="url(#shadow)" transform="translate(560 118) rotate(14 150 190)">
    <rect width="300" height="380" rx="28" fill="#fffef9" stroke="#d4c9b8" stroke-width="6"/>
    <line x1="48" y1="92" x2="252" y2="92" stroke="#c4a574" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="142" x2="228" y2="142" stroke="#c4a574" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="192" x2="200" y2="192" stroke="#c4a574" stroke-width="10" stroke-linecap="round"/>
    <line x1="48" y1="242" x2="236" y2="242" stroke="#c4a574" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- scattered card: lower right -->
  <g filter="url(#shadow)" transform="translate(620 560) rotate(-8 150 190)">
    <rect width="300" height="380" rx="28" fill="#f5f0e8" stroke="#d4c9b8" stroke-width="6"/>
    <line x1="48" y1="92" x2="252" y2="92" stroke="#c4a574" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <line x1="48" y1="142" x2="210" y2="142" stroke="#c4a574" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- emphasized sort arrow -->
  <g filter="url(#shadow)">
    <path
      d="M 300 700 C 430 520, 560 430, 760 300"
      fill="none"
      stroke="#fffef9"
      stroke-width="52"
      stroke-linecap="round"
    />
    <path
      d="M 760 300 L 690 286 L 724 356 Z"
      fill="#fffef9"
    />
    <circle cx="300" cy="700" r="34" fill="#fffef9"/>
  </g>
</svg>
